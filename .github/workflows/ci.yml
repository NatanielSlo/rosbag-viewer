name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          load: true
          tags: rosbag-viewer-dev
          build-args: |
            USER_UID=1001
            USER_GID=1001
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Format check
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace rosbag-viewer-dev bash -c \
            "find ws/src -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror"
      - name: Build, test, smoke-run
        run: |
          scripts/dev test
          scripts/dev smoke
